<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A space-themed math learning app for primary school students.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NumberNebula">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NumberNebula</title>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#0a0a2a">

  <!-- Shown while the app downloads (several MB on a first visit), so a child
       sees something other than a blank page. Plain CSS so it paints at once;
       removed on Flutter's first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a2a; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(circle at 50% 40%, #1a1a4e 0%, #0a0a2a 70%);
      color: #e8e8ff; font: 600 28px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.04em; transition: opacity 250ms ease-out;
    }
    #splash .orbit {
      width: 64px; height: 64px; border-radius: 50%;
      border: 3px solid rgba(6, 255, 165, 0.18); border-top-color: #06ffa5;
      animation: splash-spin 1s linear infinite;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .orbit { animation-duration: 3s; }
    }
  </style>

  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading NumberNebula">
    <div class="orbit"></div>
    <div>NumberNebula</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
</body>
</html>
