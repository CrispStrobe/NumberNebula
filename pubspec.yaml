name: space_math_academy
description: A space-themed math learning app, from primary school students onwards
publish_to: 'none'
version: 1.4.8+12

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI & Animations
  flutter_cube: ^0.1.1

  # Storage & Data
  shared_preferences: ^2.2.2
  path: ^1.8.3
  
  # Utils
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  
  # Math & Physics
  dart_csp:
    git:
      url: https://github.com/CrispStrobe/dart_csp.git
      # Pin to a stable tag. The old lockfile resolved-ref pointed at a commit
      # that no longer exists after the repo was force-pushed (dartCSP ->
      # dart_csp migration), so Vercel's clean `flutter pub get` failed
      # ("Could not find pubspec.yaml in ...") while local builds kept working
      # from the pub cache. A tag is immune to that.
      ref: v2.2.0

  in_app_purchase: ^3.1.13 
  url_launcher: ^6.3.2

  in_app_purchase_storekit: ^0.4.5
  collection: ^1.19.1
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  
flutter:
  uses-material-design: true
  generate: true # Enable i18n generation
  
  assets:
    - assets/images/
    # Only the font licence: the fonts themselves are bundled by the fonts:
    # section below, and the variable font would ship unused.
    - assets/fonts/OFL.txt
    - assets/data/starloader_levels.json
    - assets/data/molecule_levels.json
    - assets/puzzles/
    
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  # Kept outside assets/images/ so the 1024px source is not bundled into the app.
  image_path: "assets/branding/app_icon.png"
  # App Store rejects the 1024x1024 marketing icon if it has an alpha channel.
  # The source art is a rounded square with transparent corners, so flatten the
  # iOS icons onto the icon's own dark navy-purple background (Apple applies its
  # own corner mask, so a full opaque square is correct).
  remove_alpha_ios: true
  background_color_ios: "#15102a"
  min_sdk_android: 21
  web:
    generate: true
    # Optional: You can specify a different icon for the web if you want
    # image_path: "assets/images/web_icon.png" 
    # Optional: Adds a background color for transparent icons
    background_color: "#0a0a2a"
    # Optional: Sets the theme color in the generated manifest
    theme_color: "#0a0a2a"
