name: Hosted browser performance
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Public Vercel or GitHub Pages URL (including its project path)'
        required: true
        default: 'https://numbernebula.vercel.app/'
        type: string
      reduce_motion:
        description: 'Measure with the existing Reduce motion setting enabled'
        default: false
        type: boolean
      full_suite:
        description: 'Run both smoke and performance specs without retries (preview diagnostics)'
        default: false
        type: boolean
      protected_preview:
        description: 'Suppress the preview toolbar (disables HTTP cache; leave off for production measurements)'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tool/web_live_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/web_live_test/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Measure the hosted app
        env:
          CI: 'true'
          BASE_URL: ${{ inputs.site_url }}
          PERF_REDUCE_MOTION: ${{ inputs.reduce_motion }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_BYPASS_HOST: ${{ vars.VERCEL_BYPASS_HOST }}
          VERCEL_PREVIEW: ${{ inputs.protected_preview }}
          FULL_SUITE: ${{ inputs.full_suite }}
        run: |
          if [ "$FULL_SUITE" = true ]; then
            npx playwright test --retries=0
          else
            npx playwright test tests/performance.spec.mjs --retries=0
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-browser-performance
          path: |
            tool/web_live_test/playwright-report
            tool/web_live_test/test-results
          retention-days: 14
