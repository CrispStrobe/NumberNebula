name: Prune Vercel deployments

# Keeps at most KEEP deployments per project across the whole Vercel team.
#
# Vercel's own retention cannot do this on the Hobby plan: every project here
# already has a deploymentExpiration policy, but its `deploymentsToKeep` is
# fixed at 10 and the API refuses to change it. Ten per project across 50
# projects blew through the 10 GB free Deployment Storage allowance, so the
# count has to be enforced from outside.
#
# Never deletes a project's current production deployment, nor one pinned by a
# custom domain -- see tools/vercel_prune.py for the guards.
#
# Needs repo secret VERCEL_TOKEN and repo variable VERCEL_TEAM_ID.

on:
  schedule:
    - cron: '17 4 * * 0'   # Sundays 04:17 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: 'Deployments to keep per project'
        type: string
        default: '3'
      dry_run:
        description: 'Report only, delete nothing'
        type: boolean
        default: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prune
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          KEEP: ${{ inputs.keep || '3' }}
          # Scheduled runs prune for real; manual runs default to a dry run so
          # the button is safe to press.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 tools/vercel_prune.py
