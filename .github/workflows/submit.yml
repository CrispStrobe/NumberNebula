name: Submit (TestFlight external + App Store review)

# Everything that happens after a signed binary is already in App Store
# Connect: wait for processing and push the build to every external TestFlight
# group.
#
# App Store REVIEW SUBMISSION is deliberately not part of a tagged release.
# The app carries an open 4.3(a) (Design: Spam) rejection from 2026-09-12 and
# an Extended Review notice warning that repeated submissions risk removal from
# the Apple Developer Program. Submitting for review is a manual choice:
#   gh workflow run submit.yml -f lane=appstore_submit -f platforms='["ios"]'
#
# Kept separate from the build so it can be re-run on its own. Submission is
# the flaky half — Apple's API rejects for reasons that have nothing to do with
# the binary — and re-running the build instead would burn a second build
# number for a binary that is already uploaded and fine.
#
# Triggers:
#   * called by release.yml after a tagged build uploads
#   * manual "Run workflow" -> submit a build that is already in App Store
#                             Connect (defaults to the version in pubspec.yaml)

on:
  workflow_call:
    inputs:
      platforms:
        description: 'JSON array of platforms to submit'
        type: string
        default: '["ios", "osx"]'
      lane:
        description: 'Lane to run. A tagged release only ever does TestFlight.'
        type: string
        default: 'testflight'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to submit'
        type: choice
        options: ['["ios", "osx"]', '["ios"]', '["osx"]']
        default: '["ios", "osx"]'
      lane:
        description: 'testflight = testers only; appstore_submit = SEND TO APP REVIEW; status = read-only'
        type: choice
        options: ['testflight', 'status', 'appstore_submit']
        default: 'testflight'

env:
  BUNDLE_ID: com.crispstrobe.numbernebula

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      # One platform at a time: two concurrent deliver runs against the same app
      # record trip over each other creating the App Store version.
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Read version from pubspec
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "submitting $VER (build $BUILD) for ${{ matrix.platform }}"

      - name: TestFlight (external) + submit for App Store review
        env:
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_KEY_FILEPATH: ${{ github.workspace }}/.appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BETA_CONTACT_EMAIL: ${{ vars.BETA_CONTACT_EMAIL }}
          BETA_CONTACT_FIRST_NAME: ${{ vars.BETA_CONTACT_FIRST_NAME }}
          BETA_CONTACT_LAST_NAME: ${{ vars.BETA_CONTACT_LAST_NAME }}
          BETA_CONTACT_PHONE: ${{ vars.BETA_CONTACT_PHONE }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: fastlane ${{ inputs.lane || 'testflight' }} platform:${{ matrix.platform }}
