name: Web build & live tests

# Builds the web app exactly as Vercel does (--wasm, which also emits the JS
# fallback), reports what a visitor downloads, then opens the build in real
# browsers: Chromium gets the wasm build, Firefox the JS fallback. The build
# is served through tool/web_live_test/serve.mjs, which applies vercel.json,
# so the hosting headers are tested too. Heavy compiles run here rather than
# on the shared dev box.

on:
  push:
    branches: [main, 'perf/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_sites:
        description: Publish this tested build to Vercel and GitHub Pages
        type: boolean
        default: false
      production:
        description: Publish to the canonical Vercel domain (manual release only)
        type: boolean
        default: false
      calibration:
        description: Also capture all games for calibration
        type: boolean
        default: false
      asteroid_render_path:
        description: Asteroid rendering path for A/B comparison
        type: choice
        default: cached
        options: [cached, legacy]
      space_background_render_path:
        description: Shared space background rendering path for A/B comparison
        type: choice
        default: cached
        options: [cached, legacy]
      wormhole_render_path:
        description: Magic Triangles wormhole rendering path for A/B comparison
        type: choice
        default: cached
        options: [cached, legacy]

concurrency:
  group: web-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter SDK pin
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web (wasm + js fallback)
        env:
          ASTEROID_RENDER_PATH: ${{ inputs.asteroid_render_path || 'cached' }}
          SPACE_BACKGROUND_RENDER_PATH: ${{ inputs.space_background_render_path || 'cached' }}
          WORMHOLE_RENDER_PATH: ${{ inputs.wormhole_render_path || 'cached' }}
        run: |
          # Source maps only go into the CI artifact (Vercel builds without
          # them) so a live-test failure can be traced to Dart source.
          flutter build web --wasm --release --source-maps \
            --dart-define=ASTEROID_RENDER_PATH="$ASTEROID_RENDER_PATH" \
            --dart-define=SPACE_BACKGROUND_RENDER_PATH="$SPACE_BACKGROUND_RENDER_PATH" \
            --dart-define=WORMHOLE_RENDER_PATH="$WORMHOLE_RENDER_PATH" \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"

      - name: Browser generator timing
        # Case timeouts do not cover compilation or Chrome startup.
        timeout-minutes: 5
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: flutter test test/web/rechenquadrat_web_timing_test.dart --platform chrome --reporter expanded

      - name: Size report
        run: |
          bash tool/web_size_report.sh build/web web-size.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            build/web
            web-size.json
          retention-days: 7

  live-test:
    needs: build
    runs-on: ubuntu-latest
    # The preceding46-case job took19m47s without retries. Keep one worker
    # and unchanged per-test/performance gates for the expanded48-case suite.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tool/web_live_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/web_live_test/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Live tests (Chromium/wasm, Firefox/js)
        env:
          CI: 'true'
          PERFORMANCE_GATES: 'true'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-report
          path: |
            tool/web_live_test/playwright-report
            tool/web_live_test/test-results
          retention-days: 7

  # Deploys the build tested above, so Vercel no longer downloads Flutter and
  # rebuilds on every push: a push to main goes to production, a pull request
  # from this repo gets a preview. Vercel's own Git builds are switched off in
  # vercel.json ("git": {"deploymentEnabled": false}), so this job is also
  # where the deployed site gets its live tests. Needs secret VERCEL_TOKEN and
  # variables VERCEL_TEAM_ID, VERCEL_PROJECT_IDS and VERCEL_PREBUILT=true;
  # previews are tested through VERCEL_AUTOMATION_BYPASS_SECRET.
  deploy:
    needs: [build, live-test]
    if: >-
      vars.VERCEL_PREBUILT == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_sites))
    runs-on: ubuntu-latest
    # Includes prebuilt publication and both engines; cloud build-slot waits
    # must not consume the entire browser allowance. No new parallel jobs.
    timeout-minutes: 35
    concurrency:
      group: vercel-deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Read expected published version
        run: |
          release_version=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "EXPECTED_VERSION=${release_version%%+*}" >> "$GITHUB_ENV"
          echo "EXPECTED_BUILD=${release_version#*+}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/web_live_test/package-lock.json

      - name: Wrap the build as Vercel Build Output
        run: bash tool/vercel_prebuilt.sh build/web

      - name: Deploy
        id: deploy
        run: |
          prod=''
          if [ "$GITHUB_REF" = refs/heads/main ] || [ '${{ inputs.production }}' = true ]; then prod='--prod'; fi
          for project in ${{ vars.VERCEL_PROJECT_IDS }}; do
            url=$(VERCEL_PROJECT_ID="$project" npx --yes vercel@latest deploy --prebuilt $prod \
              --token "$VERCEL_TOKEN" --yes)
            echo "Deployed $project: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        working-directory: tool/web_live_test
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Live tests against the deployment
        working-directory: tool/web_live_test
        env:
          CI: 'true'
          # Production is checked at its public domain; the per-deployment
          # URL sits behind Deployment Protection.
          BASE_URL: ${{ (github.ref == 'refs/heads/main' || inputs.production) && (vars.PRODUCTION_URL || 'https://numbernebula.vercel.app') || steps.deploy.outputs.url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_PREVIEW: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-live-report
          path: |
            tool/web_live_test/playwright-report
            tool/web_live_test/test-results
          retention-days: 7

  calibration:
    if: github.event_name != 'workflow_dispatch' || inputs.calibration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter SDK pin
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture and replay every game
        run: >-
          dart run tool/calibrate_games.dart --capture --require-all
          --grades 1,3,6 --levels 1,10 --samples 3
          --output calibration-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-summary
          path: calibration-*.json*
          retention-days: 14

  pages:
    env:
      PAGES_HOSTING: 'true'
    needs: [build, live-test]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_sites)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Read expected published version
        run: |
          release_version=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "EXPECTED_VERSION=${release_version%%+*}" >> "$GITHUB_ENV"
          echo "EXPECTED_BUILD=${release_version#*+}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .
      - name: Prepare the tested package for its Pages base path
        run: |
          python3 -m unittest tool.test_prepare_pages -v
          python3 tool/prepare_pages.py build/web build/pages --base-href /NumberNebula/
          mkdir pages-root
          cp -a build/pages pages-root/NumberNebula
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/web_live_test/package-lock.json
      - name: Install the browser checks
        working-directory: tool/web_live_test
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Check the package under the project path without Vercel headers
        env:
          CI: 'true'
          BASE_URL: http://127.0.0.1:4173/NumberNebula/
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory pages-root > pages-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          cd tool/web_live_test
          npx playwright test tests/deployment.spec.mjs --retries=0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Check the published project path in both engines
        working-directory: tool/web_live_test
        env:
          CI: 'true'
          BASE_URL: ${{ steps.publish.outputs.page_url }}
        run: npx playwright test tests/deployment.spec.mjs --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-report
          path: |
            tool/web_live_test/playwright-report
            tool/web_live_test/test-results
            build/pages/pages-provenance.json
          retention-days: 14
