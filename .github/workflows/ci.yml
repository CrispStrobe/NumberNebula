name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter SDK pin
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Check victory completion and motion settings
        run: flutter test test/widgets/victory_motion_test.dart --concurrency=1 --reporter expanded

      - name: Check Signal Triangulation round callbacks
        run: flutter test test/widgets/signal_round_callbacks_test.dart --concurrency=1 --reporter expanded

      - name: Check spatial game round callbacks
        run: flutter test test/widgets/block_counter_round_callbacks_test.dart test/widgets/perspective_round_callbacks_test.dart --concurrency=1 --reporter expanded

      - name: Check Void Crossing restoration and motion
        run: flutter test test/widgets/void_crossing_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Circuit Repair and Warp Fold round effects
        run: flutter test test/widgets/circuit_repair_round_test.dart test/widgets/warp_fold_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Star Chart Scan round effects
        run: flutter test test/widgets/star_chart_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Cube Scanner round effects
        run: flutter test test/widgets/cube_scanner_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Cryptex round effects
        run: flutter test test/widgets/cryptex_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Grid Filler round effects
        run: flutter test test/widgets/grid_filler_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Launch Sequence round effects
        run: flutter test test/widgets/launch_sequence_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Sector Painter round effects
        run: flutter test test/widgets/sector_painter_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Ion Chain round effects
        run: flutter test test/widgets/ion_chain_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Gravity Well round effects
        run: flutter test test/widgets/gravity_well_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Comm Relay round effects
        run: flutter test test/widgets/comm_relay_round_test.dart --concurrency=1 --reporter expanded

      - name: Check Vault Cracker round effects
        run: flutter test test/widgets/vault_cracker_round_test.dart --concurrency=1 --reporter expanded

      - name: Check cached wormhole rendering
        run: flutter test test/widgets/wormhole_rendering_test.dart --concurrency=1 --reporter expanded

      - name: Check legacy wormhole rendering fallback
        run: flutter test test/widgets/wormhole_rendering_test.dart --dart-define=WORMHOLE_RENDER_PATH=legacy --concurrency=1 --reporter expanded

      - name: Check all games with reduced motion
        run: flutter test test/widgets/all_games_sessions_test.dart --dart-define=CALIBRATION_REDUCE_MOTION=true --concurrency=1 --reporter expanded

      - name: Check legacy Asteroid rendering fallback
        run: flutter test test/widgets/asteroid_rendering_test.dart test/games/asteroid_render_cache_test.dart --dart-define=ASTEROID_RENDER_PATH=legacy --concurrency=1 --reporter expanded

      - name: Check legacy shared background fallback
        run: flutter test test/widgets/space_background_rendering_test.dart --dart-define=SPACE_BACKGROUND_RENDER_PATH=legacy --concurrency=1 --reporter expanded

      - name: Run tests
        run: flutter test --concurrency=2 --reporter expanded

  version-bump:
    # A PR that changes shipping code must also move the version, otherwise a
    # release can silently reuse a build number the stores have already seen.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare pubspec version against the base branch
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

          if ! git diff --quiet "$base" -- lib pubspec.yaml assets; then
            head_version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
            base_version=$(git show "$base:pubspec.yaml" | grep -m1 '^version:' | awk '{print $2}')
            echo "base: $base_version"
            echo "head: $head_version"

            if [ "$head_version" = "$base_version" ]; then
              echo "::error::Shipping code changed but pubspec version is still $head_version."
              echo "Run: dart run tool/bump_version.dart patch"
              exit 1
            fi

            head_build=${head_version##*+}
            base_build=${base_version##*+}
            if [ "$head_build" -le "$base_build" ]; then
              echo "::error::Build number must increase ($base_build -> $head_build)."
              exit 1
            fi
          else
            echo "No changes under lib/, assets/ or pubspec.yaml — no bump required."
          fi
