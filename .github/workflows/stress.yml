name: Stress runs

# Manual-only investigations that need a quiet runner, not the shared dev box.
# Push to a stress/** branch to run them. Nothing here gates a merge.

on:
  push:
    branches: ['stress/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-glitch:
    # Chrome once drew "Relic" as "Blic" and wrapped a tutorial paragraph
    # mid-word on production. Render both repeatedly, browsers pinned to one
    # core, and flag any crop whose text differs from the majority.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: tool/web_live_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/web_live_test/package-lock.json
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install --quiet pillow
      - name: Render under load
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://numbernebula.vercel.app' }}
        run: |
          taskset -c 0 bash -c 'while :; do :; done' &
          CROPS="$PWD/crops" taskset -c 0 npx playwright test -c stress/stress.config.mjs \
            --project=chromium-wasm stress/text-glitch.spec.mjs --workers=3 --repeat-each=2 || true
          kill %1 2>/dev/null || true
      - name: Compare crops
        run: |
          python3 stress/compare_crops.py crops | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-crops-${{ matrix.shard }}
          path: tool/web_live_test/crops
          retention-days: 7
